name: Android build

on:
  push:
    branches:
      - feature/minecraft-1.21-mobs
  pull_request:
    branches:
      - main

jobs:
  newadditions:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager --install "ndk;16.1.4479499" "cmake;3.22.1"

      - name: Build New Additions debug APK
        working-directory: platforms/android
        run: ./gradlew --no-daemon assembleNewadditionsDebug
