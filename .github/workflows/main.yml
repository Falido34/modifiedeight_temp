name: Build ModifiedEight

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install pkgs
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-robust >/dev/null <<'EOF'
          Acquire::Retries "10";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          Acquire::Queue-Mode "access";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          http://mirrors.edge.kernel.org/ubuntu/
          http://archive.ubuntu.com/ubuntu/
          http://security.ubuntu.com/ubuntu/
          EOF
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update
          for attempt in 1 2 3; do
            sudo apt-get install -y --fix-missing --no-install-recommends \
              ccache libsdl1.2-dev libopenal-dev libgl1-mesa-dev zlib1g-dev libcurl4-openssl-dev && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 5
            sudo apt-get update --fix-missing || true
          done

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-build-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            linux-build-${{ runner.os }}-

      - name: do cmake stuff
        run: |
          mkdir build/
          cd build/
          ccache -z || true
          cmake .. -DDYNAMICSOUNDS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j8
          ccache -s || true
          mkdir -p modifiedeight/build/assets modifiedeight-newadditions/build/assets
          cp -r ../platforms/android/app/src/classic/assets/* modifiedeight/build/assets/ 2>/dev/null || true
          cp -r ../modifiedeight/assets/* modifiedeight/build/assets/ 2>/dev/null || true
          cp -r ../platforms/android/app/src/newadditions/assets/* modifiedeight-newadditions/build/assets/ 2>/dev/null || true
          cp -r ../modifiedeight-newadditions/assets/* modifiedeight-newadditions/build/assets/ 2>/dev/null || true

      - name: Upload Linux Classic Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-classic
          path: |
            build/modifiedeight/build/modifiedeight
            build/modifiedeight/build/assets

      - name: Upload Linux New Additions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-newadditions
          path: |
            build/modifiedeight-newadditions/build/modifiedeight-newadditions
            build/modifiedeight-newadditions/build/assets

  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install pkgs
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-robust >/dev/null <<'EOF'
          Acquire::Retries "10";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          Acquire::Queue-Mode "access";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          http://mirrors.edge.kernel.org/ubuntu/
          http://archive.ubuntu.com/ubuntu/
          http://security.ubuntu.com/ubuntu/
          EOF
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update
          for attempt in 1 2 3; do
            sudo apt-get install -y --fix-missing --no-install-recommends \
              g++-mingw-w64-x86-64-posix \
              gcc-mingw-w64-x86-64-posix \
              libz-mingw-w64-dev \
              ccache && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 5
            sudo apt-get update --fix-missing || true
          done

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: win64-build-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            win64-build-${{ runner.os }}-

      - name: Build Windows Executables
        run: |
          mkdir build/
          cd build/
          ccache -z || true

          cmake .. -DDYNAMICSOUNDS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DSDL_LIBRARY="$PWD/../prebuilt/win64/lib/SDL.dll" \
            -DSDL_INCLUDE_DIR="$PWD/../prebuilt/win64/include/" \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32/

          make -j8

          ccache -s || true

          cp ../prebuilt/win64/lib/SDL.dll .
          cp /usr/x86_64-w64-mingw32/bin/zlib1.dll . 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/zlib1.dll . 2>/dev/null || true
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-win32/libstdc++-6.dll . 2>/dev/null || true
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libstdc++-6.dll . 2>/dev/null || true
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-win32/libgcc_s_seh-1.dll . 2>/dev/null || true
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll . 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll . 2>/dev/null || true

          mkdir -p win-classic/assets win-newadditions/assets
          cp modifiedeight/build/modifiedeight.exe win-classic/
          cp modifiedeight-newadditions/build/modifiedeight-newadditions.exe win-newadditions/
          cp *.dll win-classic/
          cp *.dll win-newadditions/
          cp -r ../platforms/android/app/src/classic/assets/* win-classic/assets/ 2>/dev/null || true
          cp -r ../modifiedeight/assets/* win-classic/assets/ 2>/dev/null || true
          cp -r ../platforms/android/app/src/newadditions/assets/* win-newadditions/assets/ 2>/dev/null || true
          cp -r ../modifiedeight-newadditions/assets/* win-newadditions/assets/ 2>/dev/null || true

      - name: Upload Windows Classic Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-classic
          path: |
            build/win-classic/modifiedeight.exe
            build/win-classic/*.dll
            build/win-classic/assets

      - name: Upload Windows New Additions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-newadditions
          path: |
            build/win-newadditions/modifiedeight-newadditions.exe
            build/win-newadditions/*.dll
            build/win-newadditions/assets

  build-ios:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install pkgs
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-robust >/dev/null <<'EOF'
          Acquire::Retries "10";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          Acquire::Queue-Mode "access";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          http://mirrors.edge.kernel.org/ubuntu/
          http://archive.ubuntu.com/ubuntu/
          http://security.ubuntu.com/ubuntu/
          EOF
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update
          for attempt in 1 2 3; do
            sudo apt-get install -y --fix-missing --no-install-recommends \
              clang-14 \
              llvm-14 \
              llvm-14-dev \
              libc++-14-dev \
              libc++abi-14-dev \
              cmake \
              make \
              wget \
              tar \
              zip \
              xz-utils \
              libssl-dev \
              ccache \
              libplist-utils \
              libplist-dev \
              pkg-config \
              git \
              python3 && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 5
            sudo apt-get update --fix-missing || true
          done

      - name: Cache ccache & iOS SDK/Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            platforms/ios/build/work/sdks
            platforms/ios/build/work/toolchain
          key: ios-sdk-toolchain-v2-${{ runner.os }}-${{ hashFiles('platforms/ios/build.sh') }}
          restore-keys: |
            ios-sdk-toolchain-v2-${{ runner.os }}-

      - name: Build iOS IPAs
        working-directory: platforms/ios
        run: |
          ccache -z || true
          chmod +x build.sh build-ipa.sh
          ./build.sh classic
          ./build.sh newadditions
          ccache -s || true

      - name: Upload iOS Classic Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-ipa-classic
          path: platforms/ios/build/ModifiedEight.ipa

      - name: Upload iOS New Additions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-ipa-newadditions
          path: platforms/ios/build/ModifiedEight-NewAdditions.ipa

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install NDK Dependencies
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-robust >/dev/null <<'EOF'
          Acquire::Retries "10";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          Acquire::Queue-Mode "access";
          EOF
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'EOF'
          http://mirrors.edge.kernel.org/ubuntu/
          http://archive.ubuntu.com/ubuntu/
          http://security.ubuntu.com/ubuntu/
          EOF
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing \
            libncurses5 \
            libtinfo5 \
            lib32z1 \
            libc6-i386 \
            lib32stdc++6 2>/dev/null || true

          if [ ! -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 \
              /usr/lib/x86_64-linux-gnu/libncurses.so.5
          fi

          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
              /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android NDK & SDK Components
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/16.1.4479499
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-16.1.4479499-cmake-${{ runner.os }}

      - name: Setup Android NDK and SDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")

          yes | $SDKMANAGER --licenses || true

          $SDKMANAGER \
            "ndk;16.1.4479499" \
            "cmake;3.22.1" \
            "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: platforms/android
        run: chmod +x gradlew

      - name: Build Release APKs
        working-directory: platforms/android
        run: ./gradlew assembleRelease

      - name: Upload Android Classic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk-classic
          path: platforms/android/app/build/outputs/apk/classic/release/*.apk

      - name: Upload Android New Additions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk-newadditions
          path: platforms/android/app/build/outputs/apk/newadditions/release/*.apk

  create-release:
    needs: [build-linux, build-windows, build-ios, build-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Artifacts and Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets

          if [ -f artifacts/build-linux-classic/modifiedeight ]; then
            chmod +x artifacts/build-linux-classic/modifiedeight
          fi
          if [ -f artifacts/build-linux-newadditions/modifiedeight-newadditions ]; then
            chmod +x artifacts/build-linux-newadditions/modifiedeight-newadditions
          fi

          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              artifact_name="$(basename "$dir")"
              (cd "$dir" && zip -r "../../release-assets/${artifact_name}.zip" .)
            fi
          done

          VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' platforms/android/app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            VERSION="build"
          fi

          TAG_NAME="v${VERSION}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || gh release view "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG_NAME" release-assets/*.zip \
            --title "ModifiedEight ${TAG_NAME}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
